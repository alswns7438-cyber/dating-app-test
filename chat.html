<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>썸틱 · 채팅</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#241528; --card:#FFF8F0; --ink:#2A1E2E; --ink-soft:#8A7A8F;
    --accent:#8B5CF6; --bubble-me:#8B5CF6; --bubble-them:#F0E4D2;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#17101A; --card:#2C222F; --ink:#F3ECF6; --ink-soft:#B0A3B5; --bubble-them:#3A281C; }
  }
  :root[data-theme="dark"]{ --bg:#17101A; --card:#2C222F; --ink:#F3ECF6; --ink-soft:#B0A3B5; --bubble-them:#3A281C; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex; justify-content:center; padding:16px;
  }
  .stage{ width:100%; max-width:420px; display:flex; flex-direction:column; }
  .back{ color:var(--accent); font-size:13px; text-decoration:none; margin-bottom:10px; display:inline-block; }
  .header{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .av{ width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:16px; }
  .name{ font-weight:800; font-size:16px; }
  .chat-card{
    background:var(--card); border-radius:20px; overflow:hidden;
    display:flex; flex-direction:column; height:min(600px, 74vh);
    box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg{ max-width:75%; padding:9px 13px; border-radius:15px; font-size:14px; line-height:1.5; }
  .msg.me{ align-self:flex-end; background:var(--bubble-me); color:#fff; border-bottom-right-radius:4px; }
  .msg.them{ align-self:flex-start; background:var(--bubble-them); color:var(--ink); border-bottom-left-radius:4px; }
  .empty{ color:var(--ink-soft); font-size:13px; text-align:center; padding:40px 20px; }
  .inputbar{ display:flex; gap:8px; padding:12px; border-top:1px solid rgba(0,0,0,.08); }
  .inputbar input{
    flex:1; border:1px solid rgba(0,0,0,.15); background:var(--bg); color:var(--ink);
    border-radius:12px; padding:10px 13px; font-size:14px; outline:none;
  }
  .inputbar button{
    background:var(--accent); color:#fff; border:none; border-radius:12px; padding:0 16px; font-size:14px;
  }
  .pick{ margin-top:16px; }
  .pick .row{
    display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .pick .row .n{ font-weight:700; font-size:14px; }
</style>
</head>
<body>
<div class="stage">
  <a class="back" href="matches.html">← 매칭 목록으로</a>
  <div id="pickerArea"></div>
  <div id="chatArea" style="display:none;">
    <div class="header">
      <div class="av" id="chatAv"></div>
      <div class="name" id="chatName"></div>
    </div>
    <div class="chat-card">
      <div class="messages" id="messages"><div class="empty">불러오는 중...</div></div>
      <div class="inputbar">
        <input id="input" placeholder="메시지를 입력하세요" />
        <button id="sendBtn">전송</button>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://tsrfquzogwcdjdsqqasl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_un0C00HYmC7vW4dSsFttcg_a5ILKQ4R";
  let client = null;
  try { client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){ console.error(e); }

  let myId = localStorage.getItem("someTik_myId");
  if (!myId){
    myId = crypto.randomUUID();
    localStorage.setItem("someTik_myId", myId);
  }

  const profileById = {
    "11111111-1111-1111-1111-111111111111": { name:"소연", initial:"소", color1:"#FF8A65", color2:"#FF6B5B" },
    "22222222-2222-2222-2222-222222222222": { name:"민재", initial:"민", color1:"#8B5CF6", color2:"#5B3FE0" },
    "33333333-3333-3333-3333-333333333333": { name:"하은", initial:"하", color1:"#3DD68C", color2:"#1FB878" },
    "44444444-4444-4444-4444-444444444444": { name:"준호", initial:"준", color1:"#4C6FFF", color2:"#2F4BDC" },
    "55555555-5555-5555-5555-555555555555": { name:"지원", initial:"지", color1:"#FF6B9D", color2:"#E0447A" }
  };

  const params = new URLSearchParams(location.search);
  let otherId = params.get("with");

  const pickerArea = document.getElementById("pickerArea");
  const chatArea = document.getElementById("chatArea");
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");

  async function showPicker(){
    if (!client) return;
    const { data } = await client.from("matches").select("user_a, user_b")
      .or(`user_a.eq.${myId},user_b.eq.${myId}`);
    if (!data || data.length === 0){
      pickerArea.innerHTML = '<div class="empty">매칭된 상대가 없어요.</div>';
      return;
    }
    pickerArea.innerHTML = '<div class="pick"></div>';
    const wrap = pickerArea.querySelector(".pick");
    data.forEach(m => {
      const oid = m.user_a === myId ? m.user_b : m.user_a;
      const p = profileById[oid];
      if (!p) return;
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<div class="av" style="width:40px;height:40px;background:linear-gradient(135deg,${p.color1},${p.color2})">${p.initial}</div><div class="n">${p.name}</div>`;
      row.onclick = () => { location.href = "chat.html?with=" + oid; };
      wrap.appendChild(row);
    });
  }

  function addBubble(text, who){
    const d = document.createElement("div");
    d.className = "msg " + who;
    d.textContent = text;
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function loadMessages(){
    const { data, error } = await client.from("messages")
      .select("sender_id, content, created_at")
      .or(`and(match_user_a.eq.${myId},match_user_b.eq.${otherId}),and(match_user_a.eq.${otherId},match_user_b.eq.${myId})`)
      .order("created_at", { ascending: true });
    messagesEl.innerHTML = "";
    if (error){
      messagesEl.innerHTML = '<div class="empty">불러오기 실패: ' + error.message + '</div>';
      return;
    }
    if (!data || data.length === 0){
      messagesEl.innerHTML = '<div class="empty">대화를 시작해보세요!</div>';
      return;
    }
    data.forEach(m => addBubble(m.content, m.sender_id === myId ? "me" : "them"));
  }

  async function sendMessage(){
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    await client.from("messages").insert({
      match_user_a: myId,
      match_user_b: otherId,
      sender_id: myId,
      content: text
    });
    loadMessages();
  }

  async function initChat(){
    const p = profileById[otherId];
    if (!p){
      chatArea.innerHTML = '<div class="empty">상대 정보를 찾을 수 없어요.</div>';
      chatArea.style.display = "block";
      return;
    }
    document.getElementById("chatAv").textContent = p.initial;
    document.getElementById("chatAv").style.background = `linear-gradient(135deg, ${p.color1}, ${p.color2})`;
    document.getElementById("chatName").textContent = p.name;
    chatArea.style.display = "flex";
    chatArea.style.flexDirection = "column";
    await loadMessages();
    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
    setInterval(loadMessages, 3000);
  }

  if (otherId){
    initChat();
  } else {
    showPicker();
  }
</script>
</body>
</html>
