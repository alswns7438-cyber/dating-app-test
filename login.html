<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>썸틱 · 로그인</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:#241528; color:#F3ECF6;
    font-family:-apple-system,'Noto Sans KR',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .box{ width:100%; max-width:380px; }
  h1{ font-size:28px; margin:0 0 4px; }
  .sub{ color:#B0A3B5; font-size:13.5px; margin:0 0 24px; }
  .card{ background:#FFF8F0; color:#2A1E2E; border-radius:20px; padding:20px; }
  label{ display:block; font-size:12.5px; color:#8A7A8F; margin:12px 0 4px; }
  input{ width:100%; padding:12px; border-radius:12px; border:1px solid #ccc; font-size:15px; }
  button{ width:100%; margin-top:14px; padding:13px; border:none; border-radius:12px;
    font-size:15px; font-weight:700; }
  .p{ background:#8B5CF6; color:#fff; }
  .g{ background:#fff; color:#8B5CF6; border:1px solid #8B5CF6; margin-top:8px; }
  .msg{ margin-top:12px; font-size:13px; white-space:pre-line; line-height:1.5; }
</style>
</head>
<body>
<div class="box">
  <h1>썸틱</h1>
  <div class="sub">이메일로 시작해보세요</div>
  <div class="card">
    <label>이메일</label>
    <input id="email" type="email" placeholder="example@email.com">
    <label>비밀번호 (6자 이상)</label>
    <input id="pw" type="password" placeholder="비밀번호">
    <button class="p" id="loginBtn">로그인</button>
    <button class="g" id="signupBtn">회원가입</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
  const client = window.supabase.createClient(
    "https://tsrfquzogwcdjdsqqasl.supabase.co",
    "sb_publishable_un0C00HYmC7vW4dSsFttcg_a5ILKQ4R"
  );
  const msgEl = document.getElementById("msg");
  function show(t, ok){ msgEl.textContent = t; msgEl.style.color = ok ? "#1FA463" : "#D64545"; }

  client.auth.getSession().then(({ data }) => {
    if (data.session) location.href = "swipe.html";
  });

  async function go(mode){
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("pw").value;
    if (!email || !password){ show("이메일과 비밀번호를 입력해주세요."); return; }
    show("처리 중...", true);
    const res = mode === "signup"
      ? await client.auth.signUp({ email, password })
      : await client.auth.signInWithPassword({ email, password });
    if (res.error){ show(res.error.message); return; }
    if (!res.data.session){
      show("가입은 됐어요. 이메일 인증이 필요한 상태예요.");
      return;
    }
    location.href = "swipe.html";
  }
  document.getElementById("loginBtn").onclick = () => go("login");
  document.getElementById("signupBtn").onclick = () => go("signup");
</script>
</body>
</html>
